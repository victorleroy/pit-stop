# Pit Stop on Fly.io, from the published image. Replace the app name with your own, then see
# "On Fly.io" in the README.
app = "your-pit-stop"
primary_region = "cdg"

[build]
  image = "ghcr.io/victorleroy/pit-stop:latest"

# APP_URL is required: `fly secrets set APP_URL=https://<app>.fly.dev` before deploying.
# The image defaults to EDITION=self-hosted, with no quotas.

# One instance on purpose (ADR-001 D2): it is what makes the in-memory RetroSession actor
# correct without Redis or any shared state. The trade-off is a short gap on deploy.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[[mounts]]
  source = "pit_stop_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 500
    soft_limit = 400

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"
